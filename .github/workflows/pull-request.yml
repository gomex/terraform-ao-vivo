name: Pull Request

on:
  pull_request:

permissions:
  id-token: write # OIDC com a AWS
  contents: read
  pull-requests: write # comentário com o plan

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    name: terraform plan
    # PRs de fork (a plateia) não recebem credencial da AWS nem permissão de
    # comentar aqui; o plan deles roda no pull-request-fork.yml, após aprovação.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-state
      cancel-in-progress: false
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.x"
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init
        run: >-
          terraform init
          -backend-config="region=${{ env.AWS_REGION }}"

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        run: terraform plan -out=tfplan

      - name: Exporta o plan em texto
        run: terraform show -no-color tfplan > plan.txt

      - name: Comenta o plan no PR
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const marcador = "<!-- terraform-plan -->";
            let plano = fs.readFileSync("terraform/plan.txt", "utf8");
            const resumo = plano.split("\n").find((l) => /^(Plan:|No changes)/.test(l)) || "Plano gerado";
            if (plano.length > 60000) plano = plano.slice(0, 60000) + "\n... (cortado)";
            const body = [
              marcador,
              `### Terraform plan\n**${resumo}**`,
              "<details><summary>Ver o plano completo</summary>\n",
              "```terraform", plano, "```",
              "</details>",
            ].join("\n");

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comentarios = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existente = comentarios.find((c) => c.body.includes(marcador));
            if (existente) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existente.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  packer:
    name: packer validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-packer@v3
        with:
          version: latest

      - name: packer init
        run: packer init packer

      - name: packer fmt
        run: packer fmt -check packer

      - name: packer validate
        run: packer validate -syntax-only packer

      - name: Instala o Ansible
        run: pipx install ansible-core

      - name: ansible syntax-check
        run: ansible-playbook --syntax-check -i localhost, ansible/playbook.yml
